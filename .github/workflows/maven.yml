name: x4ld project CI

# Manual
on: workflow_dispatch


## on:
##   push:
##     branches: [ main ]
## #  pull_request:
## #    branches: [ main ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 25
      uses: actions/setup-java@v1
      with:
        java-version: '25'
    - name: Build with Maven
      run: mvn -B verify --file pom.xml
